<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Capacitaciones CERTUS</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="login-body">
    <div class="login-container">
        <h2>Portal Docente CERTUS</h2>
        <p class="subtitulo">Gestión de capacitaciones docentes</p>

        <form id="loginForm" novalidate>
            <label for="email">Correo institucional</label>
            <input type="email" id="email" placeholder="usuario@certus.edu.pe"
                   autocomplete="username" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Ingresa tu contraseña"
                   autocomplete="current-password" required>

            <button type="submit" id="btnIngresar">Ingresar</button>
            <p id="mensaje" class="mensaje" role="alert"></p>
        </form>
    </div>
    <script src="./js/main.js"></script>
</body>
</html>
